[build]
  command = "npm run verify:release"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pg"]
[[redirects]]
  from = "https://helpdesk-consultegeo.netlify.app/"
  to = "https://helpdesk.consultegeo.org/"
  status = 302
  force = true
[[redirects]]
  from = "https://helpdesk-consultegeo.netlify.app/index.html"
  to = "https://helpdesk.consultegeo.org/"
  status = 302
  force = true
[[redirects]]
  from = "https://helpdesk-consultegeo.netlify.app/support/tickets/*"
  to = "https://helpdesk.consultegeo.org/support/tickets/:splat"
  status = 302
  force = true
[[redirects]]
  from = "/wiki"
  to = "https://wiki-consultegeo.netlify.app/wiki/"
  status = 200
  force = true
[[redirects]]
  from = "/wiki/*"
  to = "https://wiki-consultegeo.netlify.app/wiki/:splat"
  status = 200
  force = true
[[redirects]]
  from = "/support/tickets/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://xaelbntjnvztznnpcvtm.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
[[headers]]
  for = "/wiki"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://xaelbntjnvztznnpcvtm.supabase.co; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; frame-src https://www.youtube-nocookie.com; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'"
[[headers]]
  for = "/wiki/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://xaelbntjnvztznnpcvtm.supabase.co; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; frame-src https://www.youtube-nocookie.com; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'"
