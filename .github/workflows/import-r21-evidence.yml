name: Export verified R22 handoff
on:
  push:
    branches: ['ops/m1-r22-evidence-import']
permissions:
  contents: read
jobs:
  export:
    if: github.repository == 'Consulte-GEO/help-desk-multi-tenant' && github.ref == 'refs/heads/ops/m1-r22-evidence-import'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: da331df619492c8eab370fdaeeed41c9ac499057
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reverify evidence and export exact product tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = da331df619492c8eab370fdaeeed41c9ac499057
          test -z "$(git status --porcelain)"
          node scripts/check-homologation.mjs
          mkdir -p "$RUNNER_TEMP/r22-export"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/r22-export/source.tar.gz"
          git diff --binary b77399a4334115bc499c35b6cdf6c0a69f345062 HEAD > "$RUNNER_TEMP/r22-export/helpdesk-m1-r22-only.patch"
          git diff --binary 9fa74499f2f81a61de044d5826fbc398c5e167b3 HEAD > "$RUNNER_TEMP/r22-export/helpdesk-m1-r20-r22.patch"
          git ls-tree -r HEAD > "$RUNNER_TEMP/r22-export/git-tree.txt"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/r22-export/source-git.txt"
          git diff --name-only b77399a4334115bc499c35b6cdf6c0a69f345062 HEAD > "$RUNNER_TEMP/r22-export/changed-paths.txt"
          node --input-type=module -e "import {sourceFingerprint} from './scripts/homologation-core.mjs'; console.log(await sourceFingerprint(process.cwd()));" > "$RUNNER_TEMP/r22-export/fingerprint.txt"
          cd "$RUNNER_TEMP/r22-export"
          sha256sum source.tar.gz helpdesk-m1-r22-only.patch helpdesk-m1-r20-r22.patch git-tree.txt source-git.txt changed-paths.txt fingerprint.txt > SHA256SUMS.txt
      - name: Preserve exact export; not a new CI test run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: helpdesk-r22-exact-export-da331df
          path: ${{ runner.temp }}/r22-export/
          retention-days: 14
          if-no-files-found: error
