name: Help Desk quality gates
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'work/**']
concurrency:
  group: helpdesk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  application:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm run check:lock
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm audit --audit-level=high
  postgres-rls:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: helpdesk_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_disposable_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d helpdesk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ALLOW_DATABASE_TESTS: '1'
      HELPDESK_TEST_ADMIN_URL: postgresql://postgres:local_disposable_ci_password@127.0.0.1:5432/helpdesk_test
      HELPDESK_TEST_APP_URL: postgresql://helpdesk_app:local_disposable_app_password@127.0.0.1:5432/helpdesk_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm run check:lock
      - run: npm ci --ignore-scripts
      - run: npm run check:migrations
      - run: npm run test:db
