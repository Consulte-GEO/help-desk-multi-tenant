name: Help Desk quality gates
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'work/**', 'codex/**']
concurrency:
  group: helpdesk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  homologation:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Prepare browser tooling in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/helpdesk-browser"
          "$RUNNER_TEMP/helpdesk-browser/bin/python" -m pip install 'playwright==1.55.1'
          "$RUNNER_TEMP/helpdesk-browser/bin/python" -m playwright install --with-deps chromium
          echo "$RUNNER_TEMP/helpdesk-browser/bin" >> "$GITHUB_PATH"
      - name: Execute application, PostgreSQL 17, upgrade and browser gates
        run: npm run homologate:local
      - name: Validate generated evidence
        run: npm run check:homologation
      - name: Preserve actual results even when a gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helpdesk-homologation-${{ github.sha }}
          path: |
            evidence/homologation/
            evidence/browser-smoke.json
            evidence/browser-human-session.json
            evidence/*.png
          retention-days: 14
          if-no-files-found: error
