<script>

const APP_VERSION='3.6.0';
const Similarity=window.SimilarityEngine;

const AVAILABLE_MODELS=['gpt-5.6','gpt-5.6-terra','gpt-5.6-luna','gpt-5.5','gpt-5.4','gpt-5.4-mini'];

const DEFAULT_MODEL='gpt-5.6';
const AI_PROXY_URL='https://yglcnirbnbwjqpvalqif.supabase.co/functions/v1/importa-openai';
const isValidModelId=v=>/^[a-z0-9][a-z0-9._\-]{1,63}$/i.test(String(v||'').trim());
const resolveModel=v=>{const s=String(v||'').trim();return AVAILABLE_MODELS.includes(s)?s:(isValidModelId(s)?s:DEFAULT_MODEL)};
const PAGE_SIZE=60;
const FIXED_OUTPUT_FIELDS=[
  'Número Concretagem','Data Concretagem','N.F. DANFE','Volume','Placa','Bloco','Unidade','Peça','Concreto','Slump','Flow','Usina','Laboratorio','Hora Carregamento','Hora Chegada','Hora Inicio','Hora Final','Observação Entrega'

  'Slump':['slump','abatimento','abat.','slump test','abatimento final'],
  'Flow':['flow','espalhamento'],
  'Usina':['fornecedor','concreteira','usina','fornecedor de concreto'],
  'Laboratorio':['laboratorio','laboratório','lab','laboratório de moldagem'],
  'Hora Carregamento':['hora carregamento','carregamento','saída da concreteira','saida da concreteira','saída usina'],
  'Hora Chegada':['hora chegada','chegada à obra','chegada do caminhão','chegada'],
  'Hora Inicio':['hora inicio','hora início','início descarregamento','inicio da descarga','início da descarga'],

  'Observação Entrega':['observação entrega','observacao entrega','observação','obs','comentário','comentario']
};

  local:['elemento','peça','local','serviço','pavimento','torre','bloco','unidade'],fck:['fck','traço','concreto','resistência projeto'],
  usina:['fornecedor','concreteira','usina'],lab:['laboratorio','laboratório'],slump:['slump','abatimento'],flow:['flow','espalhamento'],
  time:['hora','carregamento','chegada','descarga','aplicação'],result:['rompimento','ruptura','resultado','resistência','mpa','cp'],material:['material']

const APPLICATION_TAGS={
  fundacao:['fundacao','fundação','infraestrutura','estaca','helice','hélice','tubulao','tubulão','sapata','radier','bloco de fundacao','bloco de fundação','bloco de coroamento','coroamento','baldrame','viga de fundacao','viga de fundação','viga de travamento'],
  superestrutura:['superestrutura','estrutura','pilar','pilares','viga','vigas','laje','lajes','pavimento','escada','nucleo','núcleo','cobertura','atico','ático','heliponto'],

const appState={
  mode:null,step:1,model:DEFAULT_MODEL,aiMode:'proxy',proxyUrl:AI_PROXY_URL,apiKey:'',apiRemember:false,settings:{...DEFAULT_SETTINGS},activeSuggestionTab:'proposal',previewPage:0,filterOnlyIssues:false,

// ============================================================
// UTILITÁRIOS
// ============================================================
const Utils={
  qs:(s,r=document)=>r.querySelector(s),qsa:(s,r=document)=>Array.from(r.querySelectorAll(s)),
  esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')},
  slug(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[º°]/g,'').replace(/\s+/g,' ').trim()},
  isFilled(v){return !(v===null||v===undefined||String(v).trim()==='')},
  placeholder(v){return PLACEHOLDERS.has(String(v??'').trim().toUpperCase())},
  cleanPlaceholder(v){return this.placeholder(v)?'':v},
  uniq(arr,keyFn=x=>typeof x==='string'?x:JSON.stringify(x)){const s=new Set();return (arr||[]).filter(x=>{const k=keyFn(x);if(s.has(k))return false;s.add(k);return true})},
  clamp(n,min,max){return Math.max(min,Math.min(max,n))},
  clone(o){return JSON.parse(JSON.stringify(o))},
  debounce(fn,ms=350){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}},
  excelCol(i){let s='';for(let n=i+1;n>0;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s},

        <div class="grid-4" style="margin-top:10px"><div><label class="label">Data antiga após (anos)</label><input id="setting-oldDateYears" class="field" type="number" value="${s.oldDateYears}"></div><div><label class="label">Máx. resistência</label><input id="setting-maxResult" class="field" type="number" value="${s.maxResult}"></div><div><label class="label">Limpeza de NF</label><select id="setting-nfCleanup" class="field"><option value="preserve" ${s.nfCleanup==='preserve'?'selected':''}>Preservar</option><option value="trim-punctuation" ${s.nfCleanup==='trim-punctuation'?'selected':''}>Remover pontuação final</option><option value="digits-only" ${s.nfCleanup==='digits-only'?'selected':''}>Somente dígitos</option></select></div><div><label class="label">Modo de exportação</label><select id="setting-strictMode" class="field"><option value="true" ${s.strictMode?'selected':''}>Bloquear com críticos</option><option value="false" ${!s.strictMode?'selected':''}>Permitir rascunho</option></select></div></div>
        <div class="grid-3" style="margin-top:10px"><div><label class="label">Concreto de canteiro</label><select id="setting-canteiroPolicy" class="field"><option value="review" ${s.canteiroPolicy==='review'?'selected':''}>Revisar</option><option value="exclude" ${s.canteiroPolicy==='exclude'?'selected':''}>Excluir</option><option value="include" ${s.canteiroPolicy==='include'?'selected':''}>Incluir</option></select></div><div><label class="label">Materiais ≠ concreto</label><select id="setting-nonConcretePolicy" class="field"><option value="exclude" ${s.nonConcretePolicy==='exclude'?'selected':''}>Excluir e reportar</option><option value="review" ${s.nonConcretePolicy==='review'?'selected':''}>Revisar</option><option value="include" ${s.nonConcretePolicy==='include'?'selected':''}>Incluir</option></select></div><div><label class="label">Slump na origem</label><select id="setting-slumpSourceMeaning" class="field"><option value="auto" ${s.slumpSourceMeaning==='auto'?'selected':''}>Auto detectar</option><option value="measured" ${s.slumpSourceMeaning==='measured'?'selected':''}>Valor medido</option><option value="specification" ${s.slumpSourceMeaning==='specification'?'selected':''}>Especificação</option></select></div></div>
        <div class="checkline" style="margin-top:10px"><label class="checkpill ok"><input id="setting-zeroResultAsBlank" type="checkbox" ${s.zeroResultAsBlank?'checked':''}> Resultado 0 vira vazio</label><label class="checkpill ok"><input id="setting-fillNominalFreshTest" type="checkbox" ${s.fillNominalFreshTest?'checked':''}> Propor Slump/Flow nominal</label></div>
      </div></details>
      <div class="toolbar" style="margin-top:14px"><button class="btn btn-ghost" data-action="save-local">Salvar referências neste navegador</button><button class="btn btn-danger" data-action="clear-local">Limpar</button><span class="spacer"></span><button class="btn btn-primary btn-lg" data-action="analyze" ${ready?'':'disabled'}>Analisar e mapear →</button></div>
    </section>`;
  },
  preDiagnosis(){
    const p=appState.pre,d=p.diagnosis||{};
    return`<section class="card panel">
      <div class="section-head"><div><div class="section-title">2. Diagnóstico da pasta de trabalho</div><div class="section-sub">O programa limita a leitura ao conteúdo real, expande células mescladas e classifica o arquétipo estrutural.</div></div><div class="toolbar"><button class="btn btn-ghost btn-sm" data-action="back-setup">← Voltar</button><button class="btn btn-primary btn-sm" data-action="confirm-diagnosis">Confirmar diagnóstico →</button></div></div>
      <div class="stat-grid" style="margin-bottom:12px"><div class="stat info"><div class="stat-label">Arquétipo</div><div class="stat-value" style="font-size:17px">${Utils.esc(p.archetype||'—')}</div></div><div class="stat"><div class="stat-label">Abas</div><div class="stat-value">${p.sheets.length}</div></div><div class="stat"><div class="stat-label">Linhas úteis estimadas</div><div class="stat-value">${d.usefulRows||0}</div></div><div class="stat"><div class="stat-label">Mesclas</div><div class="stat-value">${d.mergeCount||0}</div></div><div class="stat"><div class="stat-label">Erros de célula</div><div class="stat-value">${d.errorCells||0}</div></div></div>
      <div class="sheet-grid">${p.sheets.map(s=>`<button class="sheet-card ${s.name===p.selectedSheet?'active':''}" data-action="select-sheet" data-sheet="${Utils.esc(s.name)}"><div class="toolbar"><strong>${Utils.esc(s.name)}</strong><span class="spacer"></span>${s.recommended?'<span class="badge badge-ok">Recomendada</span>':''}${s.hidden?'<span class="badge badge-warn">Oculta</span>':''}</div><div class="hint">${s.rows} linhas · ${s.cols} colunas · score ${s.score}</div><div class="hint">${Utils.esc(s.archetype)} · ${s.merges} mesclas</div></button>`).join('')}</div>
      <div class="grid-3" style="margin-top:12px">
        <div><label class="label">Início do cabeçalho</label><select id="headerStart" class="field">${Array.from({length:Math.min(25,p.matrix.length)},(_,i)=>`<option value="${i}" ${i===p.headerStart?'selected':''}>Linha ${i+1}</option>`).join('')}</select></div>
        <div><label class="label">Profundidade do cabeçalho</label><select id="headerDepth" class="field">${[1,2,3].map(n=>`<option value="${n}" ${n===p.headerDepth?'selected':''}>${n} linha(s)</option>`).join('')}</select></div>
        <div><label class="label">Candidato automático</label><select id="headerCandidate" class="field">${p.headerCandidates.map((c,i)=>`<option value="${i}" ${c.start===p.headerStart&&c.depth===p.headerDepth?'selected':''}>L${c.start+1} · ${c.depth} nível(is) · score ${c.score.toFixed(1)}</option>`).join('')}</select></div>
      </div>
      <div class="table-wrap" style="margin-top:12px;max-height:46vh">${this.rawMatrix(p.matrix,p.headerStart,p.headerDepth,22)}</div>
      <div class="info-strip" style="margin-top:10px"><strong>Aba selecionada:</strong> ${Utils.esc(p.selectedSheet)} · <strong>Cabeçalho composto:</strong> ${p.columns.length} colunas. Cabeçalhos repetidos são tratados por índice, não pelo texto.</div>
    </section>`;
  },
  rawMatrix(matrix,start,depth,limit){if(!matrix.length)return'<div class="muted" style="padding:20px">Sem dados.</div>';return`<table><tbody>${matrix.slice(0,limit).map((r,i)=>`<tr class="${i>=start&&i<start+depth?'header-highlight':''}"><td class="rowno">${i+1}</td>${(r||[]).map(v=>`<td>${Utils.esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`},
  sourceOptions(selected,allowBlank=true){return`${allowBlank?`<option value="">(não mapeado)</option>`:''}${appState.pre.columns.map(c=>`<option value="${c.index}" ${Number(selected)===c.index?'selected':''}>${Utils.esc(`${Utils.excelCol(c.index)} — ${c.label}`)}</option>`).join('')}`},
  preMapping(){
    const p=appState.pre,m=p.mapping,d=p.diagnosis||{};const resultAges=Utils.uniq([...appState.insumos.idades,...m.resultColumns.map(x=>x.detectedAge).filter(Boolean)],x=>Utils.slug(x));const used=new Set([...Object.values(m.fields).map(x=>x?.sourceIndex).filter(x=>x!==null&&x!==undefined),...m.resultColumns.filter(x=>x.age&&x.kind!=='date').map(x=>x.sourceIndex),...m.contextColumns]);const ignored=p.columns.filter(c=>!used.has(c.index));
    return`<section class="card panel">
      <div class="section-head"><div><div class="section-title">2. Confirmar mapeamento</div><div class="section-sub">A sugestão combina sinônimos e perfil do conteúdo. Apenas campos que alimentam a importação ou a proveniência entram no processamento.</div></div><div class="toolbar"><button class="btn btn-ghost btn-sm" data-action="back-diagnosis">← Voltar</button><button class="btn btn-primary btn-sm" data-action="prepare-inference">Gerar valores propostos →</button></div></div>
      <details open><summary>Detecção de aba e cabeçalho · ${Utils.esc(p.selectedSheet)} · ${d.usefulRows||0} linhas úteis · ${d.mergeCount||0} mesclas</summary><div>
        <div class="sheet-grid">${p.sheets.map(s=>`<button class="sheet-card ${s.name===p.selectedSheet?'active':''}" data-action="select-sheet" data-sheet="${Utils.esc(s.name)}"><strong>${Utils.esc(s.name)}</strong><div class="hint">${s.rows} linhas · ${s.cols} colunas · ${Utils.esc(s.archetype)}</div></button>`).join('')}</div>
        <div class="grid-3" style="margin-top:10px"><div><label class="label">Início do cabeçalho</label><select id="headerStart" class="field">${Array.from({length:Math.min(25,p.matrix.length)},(_,i)=>`<option value="${i}" ${i===p.headerStart?'selected':''}>Linha ${i+1}</option>`).join('')}</select></div><div><label class="label">Profundidade</label><select id="headerDepth" class="field">${[1,2,3].map(n=>`<option value="${n}" ${n===p.headerDepth?'selected':''}>${n} linha(s)</option>`).join('')}</select></div><div><label class="label">Candidato automático</label><select id="headerCandidate" class="field">${p.headerCandidates.map((c,i)=>`<option value="${i}" ${c.start===p.headerStart&&c.depth===p.headerDepth?'selected':''}>L${c.start+1} · ${c.depth} nível(is) · ${c.score.toFixed(1)}</option>`).join('')}</select></div></div>
      </div></details>
      ${(p.diagnosis.mappingWarnings||[]).length?`<div class="warning-strip" style="margin:10px 0"><strong>Revisão recomendada:</strong><br>${p.diagnosis.mappingWarnings.map(x=>`• ${Utils.esc(x)}`).join('<br>')}</div>`:''}
      <div class="grid-2" style="grid-template-columns:minmax(0,1.5fr) minmax(330px,.7fr);margin-top:12px">
        <div>
          <div class="table-wrap" style="max-height:49vh"><table><thead><tr><th>Campo de importação</th><th>Coluna sugerida</th><th>Confiança</th><th>Perfil</th></tr></thead><tbody>${FIXED_OUTPUT_FIELDS.filter(f=>f!=='Número Concretagem').map(f=>{const x=m.fields[f]||{};const prof=p.columnProfiles.find(c=>c.index===Number(x.sourceIndex));return`<tr><td><strong>${Utils.esc(f)}</strong>${REQUIRED_FIELDS.includes(f)?'<br><span class="badge badge-danger">obrigatório no arquivo final</span>':'<br><span class="badge badge-neutral">opcional/condicional</span>'}</td><td><select class="field" data-action="map-field" data-field="${Utils.esc(f)}" style="min-width:250px;padding:6px 8px">${this.sourceOptions(x.sourceIndex)}</select></td><td>${this.badgeConfidence(Math.round((x.score||0)*100))}</td><td class="wrap muted">${prof?Utils.esc(`datas ${prof.datePct}% · números ${prof.numberPct}% · texto ${prof.textPct}% · ${prof.examples.join(' | ')}`):'—'}</td></tr>`}).join('')}</tbody></table></div>
          <div style="margin-top:12px"><div class="section-title" style="font-size:14px">Resultados de rompimento</div><div class="section-sub">Idades detectadas podem ser usadas sem exigir cadastro interno nesta etapa.</div></div>
          <div class="table-wrap" style="max-height:27vh;margin-top:7px"><table><thead><tr><th>Origem</th><th>Idade detectada</th><th>Destino</th><th>Tipo</th></tr></thead><tbody>${m.resultColumns.length?m.resultColumns.map((r,i)=>`<tr><td>${Utils.esc(`${Utils.excelCol(r.sourceIndex)} — ${r.sourceLabel}`)}</td><td>${Utils.esc(r.detectedAge||'—')}</td><td><select class="field" data-action="map-result-age" data-result-index="${i}" style="padding:6px 8px"><option value="">Ignorar</option>${resultAges.map(a=>`<option value="${Utils.esc(a)}" ${a===r.age?'selected':''}>${Utils.esc(a)}</option>`).join('')}</select></td><td>${r.kind==='date'?'<span class="badge badge-warn">Data do ensaio</span>':'<span class="badge badge-ok">Resultado</span>'}</td></tr>`).join(''):'<tr><td colspan="4" class="muted">Nenhuma coluna candidata detectada.</td></tr>'}</tbody></table></div>
        </div>
        <div class="stack">
          <div class="card-flat panel"><div class="section-title" style="font-size:14px">Colunas auxiliares de contexto</div><div class="section-sub">Usadas somente para compor Peça e melhorar a associação.</div><div style="max-height:170px;overflow:auto;margin-top:8px">${p.columns.map(c=>`<label style="display:flex;gap:7px;align-items:flex-start;padding:4px 0"><input type="checkbox" data-action="toggle-context" data-col="${c.index}" ${m.contextColumns.includes(c.index)?'checked':''}><span>${Utils.esc(`${Utils.excelCol(c.index)} — ${c.label}`)}</span></label>`).join('')}</div></div>
          <div class="card-flat panel"><div class="section-title" style="font-size:14px">Forward-fill condicional</div><div class="section-sub">Expande grupos até uma linha totalmente vazia.</div><div style="max-height:150px;overflow:auto;margin-top:8px">${p.columns.map(c=>`<label style="display:flex;gap:7px;align-items:flex-start;padding:4px 0"><input type="checkbox" data-action="toggle-ffill" data-col="${c.index}" ${m.forwardFillColumns.includes(c.index)?'checked':''}><span>${Utils.esc(`${Utils.excelCol(c.index)} — ${c.label}`)}</span></label>`).join('')}</div></div>
          <div class="card-flat panel"><label class="label">Coluna de Material (opcional)</label><select id="materialColumn" class="field">${this.sourceOptions(m.materialColumn)}</select></div>
          <div class="card-flat panel"><div class="section-title" style="font-size:14px">Ignoradas (${ignored.length})</div><div class="section-sub">Não alimentam o layout final nem regras auxiliares.</div><div class="hint" style="max-height:120px;overflow:auto">${ignored.length?ignored.map(c=>Utils.esc(`${Utils.excelCol(c.index)} — ${c.label}`)).join('<br>'):'Nenhuma'}</div></div>
        </div>
      </div>
    </section>`;
  },
  preInference(){
    const p=appState.pre;const groups=p.suggestionGroups.filter(g=>g.type===appState.activeSuggestionTab);const pendingProposals=p.proposals.filter(x=>x.status==='pending').length;const counts={proposal:p.proposals.length,concrete:p.suggestionGroups.filter(g=>g.type==='concrete').length,structure:p.suggestionGroups.filter(g=>g.type==='structure').length,registry:p.registrationSuggestions.length,excluded:p.excludedRows.length};
    return`<section class="card panel">
      <div class="section-head"><div><div class="section-title">3. Valores propostos e associações</div><div class="section-sub">Nada inferido substitui um valor presente. Cada proposta registra regra, origem e decisão; ambiguidades continuam pendentes até escolha humana.</div></div><div class="toolbar"><button class="btn btn-ghost btn-sm" data-action="back-mapping">← Voltar</button>${appState.apiKey?'<button class="btn btn-ghost btn-sm" data-action="refine-ai">Refinar ambiguidades com IA</button>':''}<button class="btn btn-primary btn-sm" data-action="finalize-conversion">Validar e visualizar →</button></div></div>
      <div class="stat-grid" style="margin-bottom:12px"><div class="stat"><div class="stat-label">Linhas candidatas</div><div class="stat-value">${p.candidateRows.length}</div></div><div class="stat warn"><div class="stat-label">Propostas pendentes</div><div class="stat-value">${pendingProposals}</div></div><div class="stat info"><div class="stat-label">Associações pendentes</div><div class="stat-value">${p.suggestionGroups.filter(g=>g.status==='pending').length}</div></div><div class="stat"><div class="stat-label">Excluídas</div><div class="stat-value">${p.excludedRows.length}</div></div><div class="stat ok"><div class="stat-label">Normalizações</div><div class="stat-value">${p.corrections.length}</div></div></div>
      <div class="toolbar" style="margin-bottom:9px"><div class="tabs"><button class="tab ${appState.activeSuggestionTab==='proposal'?'active':''}" data-action="suggest-tab" data-tab="proposal">Valores propostos (${counts.proposal})</button><button class="tab ${appState.activeSuggestionTab==='concrete'?'active':''}" data-action="suggest-tab" data-tab="concrete">Traços ambíguos (${counts.concrete})</button><button class="tab ${appState.activeSuggestionTab==='structure'?'active':''}" data-action="suggest-tab" data-tab="structure">Estrutura (${counts.structure})</button><button class="tab ${appState.activeSuggestionTab==='registry'?'active':''}" data-action="suggest-tab" data-tab="registry">Novos cadastros (${counts.registry})</button><button class="tab ${appState.activeSuggestionTab==='excluded'?'active':''}" data-action="suggest-tab" data-tab="excluded">Excluídas (${counts.excluded})</button></div><span class="spacer"></span>${appState.activeSuggestionTab==='proposal'?'<button class="btn btn-accent btn-sm" data-action="accept-all-proposals">Aceitar inequívocas em massa</button><button class="btn btn-danger btn-sm" data-action="reject-all-proposals">Rejeitar pendentes em massa</button>':['concrete','structure'].includes(appState.activeSuggestionTab)?'<button class="btn btn-accent btn-sm" data-action="accept-high">Aceitar alta confiança</button>':''}</div>
      ${appState.activeSuggestionTab==='proposal'?this.proposalPanel():appState.activeSuggestionTab==='registry'?this.registrationSuggestions():appState.activeSuggestionTab==='excluded'?this.excludedRows():`<div class="stack">${groups.length?groups.map(g=>this.suggestionCard(g)).join(''):'<div class="info-strip">Nenhuma associação deste tipo.</div>'}</div>`}
    </section>`;
  },
  proposalPanel(){const list=appState.pre.proposals;return list.length?`<div class="stack">${list.map(x=>this.proposalCard(x)).join('')}</div>`:'<div class="info-strip">Nenhum valor ausente pôde ser proposto com segurança.</div>'},
  proposalCard(proposal){const row=appState.pre.candidateRows.find(r=>r._rowId===proposal.rowId);const selected=proposal.candidates?.find(c=>c.id===proposal.selectedCandidateId)||proposal.candidates?.[0];const value=proposal.value||selected?.label||'—';const status=proposal.status==='accepted'?'<span class="badge badge-ok">Aceito</span>':proposal.status==='rejected'?'<span class="badge badge-danger">Rejeitado / pendente</span>':'<span class="badge badge-warn">Aguardando decisão</span>';const source=`${row?`${row._source.sheet} L${row._source.line}`:'linha'} · ${proposal.source||proposal.rule}`;return`<div class="suggestion ${proposal.status==='pending'?'cell-info':''}"><div class="suggestion-head"><div><div class="toolbar"><strong>${Utils.esc(proposal.field)} → ${Utils.esc(value)}</strong>${status}<span class="badge ${proposal.provenance===PROVENANCE.OPERATIONAL?'badge-info':'badge-purple'}">${Utils.esc(proposal.provenance)}</span>${proposal.conflict?'<span class="badge badge-danger">Conflito</span>':''}</div><div class="hint">${Utils.esc(source)}</div></div><span class="badge badge-neutral">${Utils.esc(proposal.rule)}</span></div>${proposal.candidates?.length?`<div class="candidate-box"><label class="label">Candidato</label><select class="field" data-action="select-proposal-candidate" data-proposal="${Utils.esc(proposal.id)}"><option value="">Selecione</option>${proposal.candidates.map(c=>`<option value="${Utils.esc(c.id)}" ${c.id===proposal.selectedCandidateId?'selected':''}>${Utils.esc(c.label)}</option>`).join('')}</select>${proposal.requiresHuman&&proposal.candidates.length>1?'<div class="hint">Há múltiplos candidatos: escolha humana obrigatória.</div>':''}</div>`:''}<div class="toolbar" style="margin-top:9px"><button class="btn btn-accent btn-sm" data-action="accept-proposal" data-proposal="${Utils.esc(proposal.id)}" ${proposal.status==='accepted'||proposal.conflict?'disabled':''}>Aceitar nesta linha</button><button class="btn btn-danger btn-sm" data-action="reject-proposal" data-proposal="${Utils.esc(proposal.id)}" ${proposal.status==='rejected'?'disabled':''}>Rejeitar</button></div></div>`},
  suggestionCard(g){
    const selected=g.candidates.find(c=>c.id===g.selectedCandidateId)||g.candidates[0];return`<div class="suggestion">
      <div class="suggestion-head"><div><div class="toolbar"><strong>${Utils.esc(g.title)}</strong><span class="badge badge-neutral">${g.rowIndexes.length} linha(s)</span>${g.status==='accepted'?'<span class="badge badge-ok">Aceito</span>':g.status==='rejected'?'<span class="badge badge-danger">Pendente manual</span>':'<span class="badge badge-warn">Aguardando decisão</span>'}</div><div class="hint">${Utils.esc(g.examples.join(' · '))}</div></div>${this.badgeConfidence(selected?.score||0)}</div>
      <div class="grid-2" style="margin-top:8px"><div class="candidate-box"><label class="label">Candidato selecionado</label><select class="field" data-action="select-candidate" data-group="${g.id}">${g.candidates.map(c=>`<option value="${c.id}" ${c.id===g.selectedCandidateId?'selected':''}>${Utils.esc(c.label)} — ${c.score}%</option>`).join('')}</select><div class="criteria">${(selected?.criteria||[]).map(x=>`<span class="badge badge-info">${Utils.esc(x)}</span>`).join('')}</div></div><div class="candidate-box"><label class="label">Contexto de origem</label><div class="muted">${Utils.esc(g.contextSummary||'—')}</div></div></div>
      <div class="toolbar" style="margin-top:9px"><button class="btn btn-accent btn-sm" data-action="accept-suggestion" data-group="${g.id}">Aceitar para o grupo</button><button class="btn btn-ghost btn-sm" data-action="accept-one" data-group="${g.id}">Aplicar só à primeira linha</button><button class="btn btn-danger btn-sm" data-action="reject-suggestion" data-group="${g.id}">Manter pendente</button></div>
    </div>`;
  },
  registrationSuggestions(){const list=appState.pre.registrationSuggestions;return list.length?`<div class="warning-strip" style="margin-bottom:10px"><strong>Importante:</strong> estes itens não entram automaticamente no XLSX. São propostas para cadastro e exigem validação de implantação/engenharia.</div><div class="table-wrap"><table><thead><tr><th>Tipo</th><th>Sugestão</th><th>Ocorrências</th><th>Exemplos</th><th>Justificativa</th></tr></thead><tbody>${list.map(x=>`<tr><td>${x.type==='trace'?'<span class="badge badge-purple">Traço</span>':'<span class="badge badge-info">Estrutura</span>'}</td><td class="wrap"><strong>${Utils.esc(x.label)}</strong>${x.unidadeTipo?`<br><span class="muted">Tipo de unidade: ${Utils.esc(x.unidadeTipo)}</span>`:''}</td><td>${x.count}</td><td class="wrap">${Utils.esc(x.examples.join(' · '))}</td><td class="wrap muted">${Utils.esc(x.reason)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="info-strip">Nenhum novo cadastro sugerido.</div>'},

  prePreview(){

// ============================================================
// LEITURA SEGURA DE WORKBOOK E PERFIL DE ABAS
// ============================================================
const SheetReader={
  safeMatrix(ws){
    const keys=Object.keys(ws).filter(k=>!k.startsWith('!'));let maxR=0,maxC=0,errorCells=0;
    for(const key of keys){const addr=XLSX.utils.decode_cell(key);if(addr.r>=appState.settings.maxScanRows||addr.c>=appState.settings.maxScanCols)continue;const cell=ws[key];if(cell?.t==='e')errorCells++;if(cell&&Utils.isFilled(cell.v)){maxR=Math.max(maxR,addr.r);maxC=Math.max(maxC,addr.c)}}
    maxR=Math.min(maxR,appState.settings.maxScanRows-1);maxC=Math.min(maxC,appState.settings.maxScanCols-1);const matrix=Array.from({length:maxR+1},()=>[]);
    for(const key of keys){const a=XLSX.utils.decode_cell(key);if(a.r>maxR||a.c>maxC)continue;const cell=ws[key];matrix[a.r][a.c]=cell?.v??''}
    const merges=(ws['!merges']||[]).filter(m=>m.s.r<=maxR&&m.s.c<=maxC);for(const m of merges){const anchor=matrix[m.s.r]?.[m.s.c]??'';for(let r=m.s.r;r<=Math.min(m.e.r,maxR);r++){if(!matrix[r])matrix[r]=[];for(let c=m.s.c;c<=Math.min(m.e.c,maxC);c++)if(!Utils.isFilled(matrix[r][c]))matrix[r][c]=anchor}}
    let last=-1,streak=0;for(let r=0;r<matrix.length;r++){const meaningful=(matrix[r]||[]).some(v=>Utils.isFilled(Utils.cleanPlaceholder(v)));if(meaningful){last=r;streak=0}else streak++;if(streak>=appState.settings.emptyStreak&&r>last+appState.settings.emptyStreak)break}
    const trimmed=matrix.slice(0,Math.max(last+1,1));const cols=trimmed.reduce((m,r)=>Math.max(m,r.length),0);return{matrix:trimmed,merges,errorCells,rows:trimmed.length,cols};
  },
  workbookSheets(wb){
    const meta=wb.Workbook?.Sheets||[];return wb.SheetNames.map((name,i)=>{const ws=wb.Sheets[name],safe=this.safeMatrix(ws);const hidden=!!meta[i]?.Hidden;const header=HeaderEngine.detect(safe.matrix);const archetype=ArchetypeEngine.detect({sheetCount:wb.SheetNames.length,hidden,merges:safe.merges,matrix:safe.matrix,header});const score=WorkbookProfiler.scoreSheet(name,safe,header,hidden);return{name,ws,hidden,...safe,header,archetype,score,recommended:false}}).sort((a,b)=>b.score-a.score).map((s,i)=>({...s,recommended:i===0}));
  }
};
const WorkbookProfiler={
  scoreSheet(name,safe,header,hidden){const top=safe.matrix.slice(0,Math.min(35,safe.matrix.length));let hits=0,filled=0,total=0;for(const row of top)for(const v of row){total++;if(Utils.isFilled(v))filled++;const s=Utils.slug(v);for(const group of Object.values(KEYWORDS))if(group.some(k=>s.includes(Utils.slug(k))))hits++}const density=total?filled/total:0;let score=hits+density*10+(safe.rows>10?4:0)+(header.score||0)/5-(hidden?5:0)-(/instru|orienta|painel|dashboard|resumo|legenda|auxiliar|gráfico|grafico/i.test(name)?7:0)-(safe.errorCells>10?3:0);if(/concreto|nota|controle|rastre|import/i.test(name))score+=5;return Number(score.toFixed(1))}
};
const HeaderEngine={
  compose(matrix,start,depth){const cols=matrix.slice(start,start+depth).reduce((m,r)=>Math.max(m,(r||[]).length),0);const filledRows=[];for(let d=0;d<depth;d++){const row=matrix[start+d]||[],filled=[];let carry='';for(let c=0;c<cols;c++){const v=String(row[c]??'').trim();if(v)carry=v;filled[c]=v||carry}filledRows.push(filled)}
    const seen=new Map(),columns=[];for(let c=0;c<cols;c++){const parts=Utils.uniq(filledRows.map(r=>String(r[c]||'').trim()).filter(Boolean),x=>Utils.slug(x));let raw=parts.join(' › ')||`Coluna ${c+1}`;const base=raw;const n=(seen.get(Utils.slug(base))||0)+1;seen.set(Utils.slug(base),n);if(n>1)raw=`${base} [${n}]`;columns.push({index:c,label:raw,rawLabel:base})}return columns;
  },
  candidateScore(matrix,start,depth){const cols=this.compose(matrix,start,depth);const labels=cols.map(c=>c.rawLabel);let kw=0,nonGeneric=0;for(const label of labels){const s=Utils.slug(label);if(!/^coluna \d+$/.test(s))nonGeneric++;for(const group of Object.values(KEYWORDS))if(group.some(k=>s.includes(Utils.slug(k))))kw++}
    const data=matrix.slice(start+depth,start+depth+8);const useful=data.filter(r=>!Utils.rowEmpty(r)).length;const numericHeader=labels.filter(x=>/^\d+(?:[.,]\d+)?$/.test(x)).length;return kw*2+nonGeneric*.15+useful*.5-numericHeader*.8;
  },
  detect(matrix){const candidates=[];for(let start=0;start<Math.min(25,matrix.length);start++)for(let depth=1;depth<=3;depth++){if(start+depth>=matrix.length)continue;const score=this.candidateScore(matrix,start,depth);candidates.push({start,depth,score,columns:this.compose(matrix,start,depth)})}candidates.sort((a,b)=>(b.score-a.score)||(a.depth-b.depth)||(b.start-a.start));return{...(candidates[0]||{start:0,depth:1,score:0,columns:[]}),candidates:candidates.slice(0,12)}}
};
const ArchetypeEngine={
  detect({sheetCount,merges,matrix,header}){const vertical=(merges||[]).filter(m=>m.e.r>m.s.r).length;const wide=(header.columns||[]).length>24;const multi=header.depth>1;const labels=(header.columns||[]).map(x=>Utils.slug(x.rawLabel)).join(' | ');if(/obrigatorio|obrigatória|numero concretagem/.test(labels)&&/data concretagem/.test(labels))return'A5 · Modelo GEO antigo';if(wide&&multi)return'A4 · Bandas horizontais / cabeçalho multinível';if(vertical>=8)return'A3 · Grupos com células mescladas';if(sheetCount>=4)return'A2 · Formulário multiaba';return'A1 · Tabela plana'}
};

// ============================================================
// PERFIL DE CONTEÚDO E MAPEAMENTO
// ============================================================
const ColumnProfiler={
  profile(matrix,columns,startRow){const sample=matrix.slice(startRow,startRow+160);return columns.map(col=>{const vals=sample.map(r=>Utils.cleanPlaceholder(r[col.index])).filter(v=>Utils.isFilled(v));const total=Math.max(vals.length,1);let dates=0,numbers=0,times=0,nfs=0,texts=0,ranges=0,fcks=0,results=0,embeddedAge=0;
      for(const v of vals){const s=String(v).trim();if(Utils.coerceDate(v)&&!/^\d{1,3}(?:[.,]\d+)?$/.test(s))dates++;const n=Utils.normalizeNumberDetailed(v).value;if(n!==''){numbers++;if(n>=0&&n<=250)results++}if(Utils.normalizeTime(v))times++;if(/^[A-Z0-9][A-Z0-9.\-\/]{2,20}$/i.test(s)&&!Utils.coerceDate(v))nfs++;if(typeof v==='string'&&/[A-Za-zÀ-ÿ]/.test(v))texts++;if(/(?:±|\+\s*\/\s*-|\+\-)/.test(s))ranges++;if(/FCK\s*\d+/i.test(s)||((n!=='')&&n>=15&&n<=100))fcks++;if(Utils.extractAge(s))embeddedAge++}
      const pct=x=>Math.round(x/total*100);return{index:col.index,label:col.label,filled:vals.length,datePct:pct(dates),numberPct:pct(numbers),timePct:pct(times),nfPct:pct(nfs),textPct:pct(texts),rangePct:pct(ranges),fckPct:pct(fcks),resultPct:pct(results),embeddedAgePct:pct(embeddedAge),examples:vals.slice(0,4).map(x=>String(x).slice(0,45))}
    })},
  officialContentScore(profile,field,matrix,start,official){const vals=matrix.slice(start,start+120).map(r=>r[profile.index]).filter(v=>Utils.isFilled(Utils.cleanPlaceholder(v)));if(!vals.length)return 0;const list=field==='Bloco'?official.blocks.map(x=>x.name):official.pairs.map(x=>x.unidade);const matches=vals.filter(v=>list.some(o=>Utils.similarity(v,o)>=.82)).length;return matches/vals.length}
};
const HeuristicMapper={

const PostAuditor={
  async run(){const issues=[];for(const file of appState.post.files){const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true,raw:true});const sheets=SheetReader.workbookSheets(wb),sheet=sheets[0],h=sheet.header,columns=h.columns,profiles=ColumnProfiler.profile(sheet.matrix,columns,h.start+h.depth),mapping=HeuristicMapper.build(columns,profiles,sheet.matrix,h.start+h.depth);const get=(vals,field)=>{const idx=mapping.fields[field]?.sourceIndex;return idx===null||idx===undefined?'':vals[idx]};const rows=[];for(let i=h.start+h.depth;i<sheet.matrix.length;i++){const vals=sheet.matrix[i]||[];if(Utils.rowEmpty(vals))continue;const nf=Utils.normalizeNF(get(vals,'N.F. DANFE'),appState.settings.nfCleanup).value,date=Utils.formatDate(get(vals,'Data Concretagem')),volume=Utils.normalizeNumberDetailed(get(vals,'Volume')).value,concrete=String(get(vals,'Concreto')||''),slump=Utils.parseFreshValue(get(vals,'Slump')).value,flow=Utils.parseFreshValue(get(vals,'Flow')).value,usina=String(get(vals,'Usina')||''),bloco=String(get(vals,'Bloco')||''),unidade=String(get(vals,'Unidade')||'');if(!nf&&!date&&!Utils.isFilled(volume))continue;const row={file:file.name,sheet:sheet.name,line:i+1,nf,date,volume,concrete,slump,flow,usina,bloco,unidade,values:vals};rows.push(row)}
      const same=new Map(),across=new Map();for(const r of rows){if(!r.nf)continue;const k=`${Utils.slug(r.usina)}|${Utils.slug(r.nf)}`;if(!same.has(k))same.set(k,[]);same.get(k).push(r);const nk=Utils.slug(r.nf);if(!across.has(nk))across.set(nk,new Map());if(!across.get(nk).has(Utils.slug(r.usina)))across.get(nk).set(Utils.slug(r.usina),[]);across.get(nk).get(Utils.slug(r.usina)).push(r)}
      for(const rs of same.values())if(rs.length>1)rs.forEach(r=>issues.push(this.issue(r,'CRÍTICO','NF duplicada por usina','Mesma NF repetida para a mesma usina.')));for(const us of across.values())if(us.size>1)for(const rs of us.values())rs.forEach(r=>issues.push(this.issue(r,'ALERTA','NF repetida entre usinas','NF repetida em usinas diferentes.')));
      const highVolumes=rows.filter(r=>Number(r.volume)>12).length;if(rows.length&&highVolumes/rows.length>.15)issues.push({file:file.name,sheet:sheet.name,line:'—',severity:'ALERTA',type:'Frequência de volumes altos',description:`${highVolumes} de ${rows.length} linhas possuem volume >12 m³.`,nf:'',usina:'',date:'',volume:'',bloco:'',unidade:''});
      for(const r of rows){const d=Utils.coerceDate(r.date),old=new Date();old.setFullYear(old.getFullYear()-5);if(d&&d>new Date())issues.push(this.issue(r,'CRÍTICO','Data futura','Data de concretagem no futuro.'));if(d&&d<old)issues.push(this.issue(r,'ALERTA','Data muito antiga','Data anterior a cinco anos.'));if(r.volume===''||Number(r.volume)===0)issues.push(this.issue(r,'CRÍTICO','Volume zero/vazio','Volume igual a zero ou ausente.'));else if(Number(r.volume)>16)issues.push(this.issue(r,'CRÍTICO','Volume >16','Volume superior a 16 m³.'));
        const fam=Utils.detectFamily(r.concrete);if(fam==='SLUMP'){if(r.slump===''||Number(r.slump)===0)issues.push(this.issue(r,'CRÍTICO','Slump ausente','Traço com SLUMP e campo vazio.'));if(r.flow!=='')issues.push(this.issue(r,'ALERTA','Flow indevido','Traço com SLUMP e Flow preenchido.'))}else if(fam==='FLOW'){if(r.flow===''||Number(r.flow)===0)issues.push(this.issue(r,'CRÍTICO','Flow ausente','Traço com FLOW e campo vazio.'));if(r.slump!=='')issues.push(this.issue(r,'ALERTA','Slump indevido','Traço com FLOW e Slump preenchido.'))}else if(r.concrete)issues.push(this.issue(r,'ALERTA','Traço incompleto','Concreto não contém SLUMP nem FLOW.'));if(r.slump!==''&&Number(r.slump)>30)issues.push(this.issue(r,'CRÍTICO','Slump impossível','Slump superior a 30 cm.'));if(r.flow!==''&&Number(r.flow)>99)issues.push(this.issue(r,'CRÍTICO','Flow impossível','Flow superior a 99 cm.'));
        for(const rm of mapping.resultColumns.filter(x=>x.kind==='result')){const parsed=Utils.parseResult(r.values[rm.sourceIndex],false);if(parsed.value!==''&&Number(parsed.value)>200)issues.push(this.issue(r,'CRÍTICO','Resistência impossível',`${rm.sourceLabel}: ${parsed.value} MPa.`))}
      }
    }appState.post.issues=Utils.uniq(issues,x=>`${x.file}|${x.sheet}|${x.line}|${x.type}|${x.description}`)},
  issue(r,severity,type,description){return{file:r.file,sheet:r.sheet,line:r.line,severity,type,description,nf:r.nf,usina:r.usina,date:r.date,volume:r.volume,bloco:r.bloco,unidade:r.unidade}},
  download(){const wb=XLSX.utils.book_new(),rows=appState.post.issues.map(i=>({Arquivo:i.file,Aba:i.sheet,'Linha Original':i.line,Severidade:i.severity,Tipo:i.type,'Descrição':i.description,'N.F. DANFE':i.nf,Usina:i.usina,'Data Concretagem':i.date,Volume:i.volume,Bloco:i.bloco,Unidade:i.unidade}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Auditoria');XLSX.writeFile(wb,'Relatorio_Pos_Importacao_Consulte_GEO.xlsx')}
};

  async loadConfigFile(file){try{const data=JSON.parse(await file.text());Exporter.importConfig(data)}catch(e){Toast.error('Arquivo JSON de configuração inválido.')}},
  openApi(){UI.showModal(UI.apiModal())},
  resolveModalModel(){const sel=Utils.qs('#apiModelInput')?.value||appState.model;if(sel==='__custom__'){const c=Utils.qs('#customModelInput')?.value.trim()||'';if(c&&isValidModelId(c))return c;if(c){Toast.warn('ID de modelo inválido; mantendo o anterior.');return appState.model}return appState.model}return resolveModel(sel)},
  saveApi(){const key=Utils.qs('#apiKeyInput')?.value.trim()||'',remember=!!Utils.qs('#apiRemember')?.checked;const mode=Utils.qs('#aiModeInput')?.value==='local'?'local':'proxy';const proxy=Utils.qs('#proxyUrlInput')?.value.trim()||appState.proxyUrl;appState.model=this.resolveModalModel();appState.aiMode=mode;if(/^https:\/\//.test(proxy))appState.proxyUrl=proxy;appState.apiKey=key;appState.apiRemember=remember&&mode==='local';STORAGE.save();UI.closeModal();UI.apiStatus();Toast.ok(mode==='proxy'?'IA configurada via servidor (proxy).':(key?'Configuração da IA salva.':'Chave removida; o motor local continua disponível.'))},
  async testApi(){const old={key:appState.apiKey,model:appState.model,mode:appState.aiMode,proxy:appState.proxyUrl};try{const mode=Utils.qs('#aiModeInput')?.value==='local'?'local':'proxy';const key=Utils.qs('#apiKeyInput')?.value.trim()||'';const proxy=Utils.qs('#proxyUrlInput')?.value.trim()||appState.proxyUrl;if(mode==='local'&&!key)throw new Error('Digite uma API key para testar.');appState.aiMode=mode;appState.apiKey=key;if(/^https:\/\//.test(proxy))appState.proxyUrl=proxy;appState.model=Actions.resolveModalModel();UI.loading(true,mode==='proxy'?'Testando o proxy do servidor...':'Testando conexão com a OpenAI...');await OpenAIClient.test();UI.loading(false);Toast.ok('Conexão validada.')}catch(e){UI.loading(false);Toast.error(e.message||'Falha no teste da API.')}finally{appState.apiKey=old.key;appState.model=old.model;appState.aiMode=old.mode;appState.proxyUrl=old.proxy}},
  clearAll(){if(!confirm('Limpar insumos, políticas e chave lembrada neste navegador?'))return;STORAGE.clear();appState.apiKey='';appState.apiRemember=false;appState.settings={...DEFAULT_SETTINGS};appState.insumos={estruturaTexto:'',estrutura:{blocks:[],pairs:[]},usinas:[],labs:[],tracos:[],idades:[]};appState.pre.file=null;this.resetPreDerived();UI.render();Toast.ok('Dados locais removidos.')}
};

// ============================================================
// DROPZONES E ARQUIVOS
// ============================================================
const Dropzones={
  bind(){this.one('#dropPre','#filePre',files=>{const f=files.find(x=>/\.xls[x]?$/i.test(x.name));if(!f){Toast.error('Selecione um arquivo .xlsx ou .xls.');return}appState.pre.file=f;Actions.resetPreDerived();appState.pre.file=f;UI.render()});this.one('#dropPost','#filePost',files=>{const valid=files.filter(x=>/\.xls[x]?$/i.test(x.name));if(!valid.length){Toast.error('Selecione arquivos .xlsx ou .xls.');return}appState.post.files=valid;appState.post.issues=[];UI.render()},true)},
  one(dropSel,inputSel,handler,multiple=false){const dz=Utils.qs(dropSel),input=Utils.qs(inputSel);if(!dz||!input||dz.dataset.bound)return;dz.dataset.bound='1';dz.addEventListener('click',()=>input.click());input.addEventListener('change',()=>handler(Array.from(input.files||[])));for(const type of['dragenter','dragover'])dz.addEventListener(type,e=>{e.preventDefault();dz.classList.add('dragover')});for(const type of['dragleave','drop'])dz.addEventListener(type,e=>{e.preventDefault();dz.classList.remove('dragover')});dz.addEventListener('drop',e=>handler(Array.from(e.dataTransfer.files||[])))}
};

// ============================================================
// EVENT DELEGATION
// ============================================================
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
  if(a==='mode-intake'){window.location.href='./pre-analise.html';return}
  if(a==='mode-pre'){appState.mode='pre';appState.step=1;UI.render()}
  else if(a==='mode-post'){appState.mode='post';appState.step=1;UI.render()}
  else if(a==='go-home'){appState.mode=null;appState.step=1;UI.render()}
  else if(a==='open-api-settings')Actions.openApi();
  else if(a==='close-modal')UI.closeModal();
  else if(a==='close-modal-backdrop'){if(e.target===el)UI.closeModal()}
  else if(a==='save-api')Actions.saveApi();
  else if(a==='test-api')Actions.testApi();
  else if(a==='save-local'){Actions.syncSetup();STORAGE.save();Toast.ok('Insumos e políticas salvos neste navegador.')}
  else if(a==='clear-local')Actions.clearAll();
  else if(a==='analyze')Actions.analyze();
  else if(a==='back-setup'){appState.step=1;UI.render()}
  else if(a==='confirm-diagnosis')Actions.confirmDiagnosis();
  else if(a==='back-diagnosis'){appState.step=1;UI.render()}
  else if(a==='prepare-inference')Actions.prepareInference();
  else if(a==='back-mapping'){appState.step=2;UI.render()}
  else if(a==='suggest-tab'){appState.activeSuggestionTab=el.dataset.tab;UI.render()}
  else if(a==='accept-suggestion'){Converter.applyGroup(el.dataset.group);UI.render()}
  else if(a==='accept-one'){Converter.applyGroup(el.dataset.group,true);UI.render()}
  else if(a==='reject-suggestion'){Converter.rejectGroup(el.dataset.group);UI.render()}
  else if(a==='accept-high'){Converter.acceptHigh(appState.activeSuggestionTab);UI.render()}
  else if(a==='accept-proposal'){Converter.applyProposal(el.dataset.proposal);UI.render()}
  else if(a==='reject-proposal'){Converter.rejectProposal(el.dataset.proposal);UI.render()}
  else if(a==='accept-all-proposals'){Converter.acceptAllProposals();UI.render()}
  else if(a==='reject-all-proposals'){Converter.rejectAllProposals();UI.render()}
  else if(a==='refine-ai')Actions.refineAI();
  else if(a==='finalize-conversion')Actions.finalizeConversion();
  else if(a==='back-inference'){appState.step=3;UI.render()}
  else if(a==='go-export'){Validators.validateAll();appState.step=5;UI.render()}
  else if(a==='back-preview'){appState.step=4;UI.render()}
  else if(a==='page-prev'){appState.previewPage=Math.max(0,appState.previewPage-1);UI.render()}
  else if(a==='page-next'){appState.previewPage++;UI.render()}
  else if(a==='page-go'){appState.previewPage=Number(el.dataset.page)||0;UI.render()}
  else if(a==='download-import')Exporter.downloadImport();
  else if(a==='download-pendencias')Exporter.downloadPendencias();
  else if(a==='download-suggestions')Exporter.downloadSuggestions();
  else if(a==='download-diagnostic')Exporter.downloadDiagnostic();
  else if(a==='export-config')Exporter.exportConfig();
  else if(a==='import-config')Utils.qs('#configFile')?.click();
  else if(a==='run-post-audit')Actions.runPostAudit();
  else if(a==='download-post-audit')PostAuditor.download();
});

document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.action;
  if(t.id==='globalModel'){appState.model=resolveModel(t.value);STORAGE.save();return}
  if(Actions.setupIds.has(t.id)){Actions.syncSetup();STORAGE.save();return}
  if(t.id==='configFile'){const f=t.files?.[0];if(f)Actions.loadConfigFile(f);return}
  if(t.id==='aiModeInput'){Utils.qs('#proxyWrap')?.classList.toggle('hidden',t.value!=='proxy');Utils.qs('#keyWrap')?.classList.toggle('hidden',t.value!=='local');return}
  if(t.id==='apiModelInput'){Utils.qs('#customModelWrap')?.classList.toggle('hidden',t.value!=='__custom__');return}
  if(t.id==='headerStart'){Actions.applyHeader(Number(t.value),appState.pre.headerDepth);UI.render();return}
  if(t.id==='headerDepth'){Actions.applyHeader(appState.pre.headerStart,Number(t.value));UI.render();return}
  if(t.id==='headerCandidate'){const c=appState.pre.headerCandidates[Number(t.value)];if(c){Actions.applyHeader(c.start,c.depth);UI.render()}return}
  if(t.id==='materialColumn'){appState.pre.mapping.materialColumn=t.value===''?null:Number(t.value);return}
  if(a==='select-sheet'){Actions.selectSheet(t.dataset.sheet);Actions.refreshMapping();UI.render();return}
  if(a==='map-field'){const f=t.dataset.field;if(appState.pre.mapping.fields[f]){appState.pre.mapping.fields[f].sourceIndex=t.value===''?null:Number(t.value);appState.pre.mapping.fields[f].score=1}return}
  if(a==='map-result-age'){const r=appState.pre.mapping.resultColumns[Number(t.dataset.resultIndex)];if(r)r.age=t.value;return}
  if(a==='toggle-context'){const c=Number(t.dataset.col),list=appState.pre.mapping.contextColumns;t.checked&&!list.includes(c)?list.push(c):!t.checked&&list.splice(list.indexOf(c),1);return}
  if(a==='toggle-ffill'){const c=Number(t.dataset.col),list=appState.pre.mapping.forwardFillColumns;t.checked&&!list.includes(c)?list.push(c):!t.checked&&list.splice(list.indexOf(c),1);return}
  if(a==='select-candidate'){const g=Converter.group(t.dataset.group);if(g)g.selectedCandidateId=t.value;UI.render();return}
  if(a==='select-proposal-candidate'){const proposal=Converter.proposal(t.dataset.proposal);if(proposal)proposal.selectedCandidateId=t.value;UI.render();return}
  if(a==='toggle-fill-nominal'){const g=Converter.group(t.dataset.group);if(g)g.fillNominal=t.checked;return}
  if(a==='toggle-issue-filter'){appState.filterOnlyIssues=t.checked;appState.previewPage=0;UI.render();return}
  if(a==='edit-official'){Actions.editRow(t.dataset.rowid,t.dataset.key,t.value);return}
});

document.addEventListener('input',e=>{if(Actions.setupIds.has(e.target.id)){Actions.syncSetup();Actions.saveSetupDebounced()}});
document.addEventListener('blur',e=>{const t=e.target;if(t.dataset.action==='edit-cell'){const clean=t.textContent.replace(/\u00a0/g,' ').trim();t.textContent=clean;Actions.editRow(t.dataset.rowid,t.dataset.key,clean)}},true);

// ============================================================
// AUTO-TESTES LOCAIS
// ============================================================
const SelfTest={
  run(){const tests=[];const assert=(name,condition,detail='')=>tests.push({name,ok:!!condition,detail});
    const structure=Utils.parseEstrutura('Bloco: Torre A\nUnidade Tipo: Pavimentos\n- Unidade: Térreo\n- Unidade: 1º Pavimento');assert('parser de estrutura',structure.pairs.length===2,JSON.stringify(structure));
    const traces=Utils.parseTracos('FCK 30 | BRITA 1 | SLUMP 10±2 CM\nAplicação: Lajes, vigas e pilares');assert('parser de traço',traces.length===1&&traces[0].fck===30&&traces[0].nominal===10&&traces[0].tolerance===2,JSON.stringify(traces));
    assert('número brasileiro',Utils.normalizeNumberDetailed('1.234,56').value===1234.56,String(Utils.normalizeNumberDetailed('1.234,56').value));
    assert('slump em faixa',Utils.parseFreshValue('14+-2').value===14,String(Utils.parseFreshValue('14+-2').value));
    assert('data Excel',!!Utils.coerceDate(45000));assert('idade',Utils.extractAge('Resultado CP 28 dias')==='28 dias',Utils.extractAge('Resultado CP 28 dias'));
    const matrix=[['RELATÓRIO','',''],['Data Moldagem','Nota Fiscal','Volume'],['01/01/2026','123',8]];const h=HeaderEngine.detect(matrix);assert('detecção de cabeçalho',h.start===1,JSON.stringify(h));
    assert('número inválido não vira zero',Utils.normalizeNumberDetailed('abc').value==='',String(Utils.normalizeNumberDetailed('abc').value));
    assert('typo numérico 36,,2',Utils.normalizeNumberDetailed('36,,2').value===36.2,String(Utils.normalizeNumberDetailed('36,,2').value));
    assert('torres com números distintos',Utils.similarity('Torre 1','Torre 19')<.6,String(Utils.similarity('Torre 1','Torre 19')));
    assert('torre igual continua alta',Utils.similarity('TORRE 04','Torre 4')>=.55,String(Utils.similarity('TORRE 04','Torre 4')));
    assert('NF com ponto final',Utils.normalizeNF('133965.').value==='133965',Utils.normalizeNF('133965.').value);
    assert('slump dual detectado',Utils.parseFreshValue('08/17').kind==='dual',Utils.parseFreshValue('08/17').kind);
    assert('resultado com idade embutida',(()=>{const r=Utils.parseResult('33,3(12 DIAS)');return r.value===33.3&&r.age==='12 dias'})(),JSON.stringify(Utils.parseResult('33,3(12 DIAS)')));
    assert('modelo customizado aceito',isValidModelId('gpt-7-preview')&&resolveModel('gpt-7-preview')==='gpt-7-preview',resolveModel('gpt-7-preview'));
    assert('modelo inválido cai no padrão',resolveModel('<script>')===DEFAULT_MODEL,resolveModel('<script>'));
    const mapMatrix=[['CONTROLE TECNOLÓGICO DO CONCRETO','',''],['Data','N.F.','Resistência / Traço'],['01/01/2026','123','FCK 30 | BRITA 1 | SLUMP 12±2 CM']];const mapHeader={start:0,depth:2,columns:HeaderEngine.compose(mapMatrix,0,2)};const mapProfiles=ColumnProfiler.profile(mapMatrix,mapHeader.columns,2);const mapped=HeuristicMapper.mapFields(mapHeader.columns,mapProfiles,mapMatrix,2);assert('cabeçalho mesclado preserva coluna folha de traço',mapped.Concreto.sourceIndex===2,JSON.stringify(mapped.Concreto));
    const priorMapping=appState.pre.mapping;appState.pre.mapping={fields:{'N.F. DANFE':{sourceIndex:1},'Data Concretagem':{sourceIndex:0},Volume:{sourceIndex:2},Concreto:{sourceIndex:3}},contextColumns:[],forwardFillColumns:[],resultColumns:[],materialColumn:null};const totalVerdict=RowEngine.classify({values:['TOTAL','',87.5,''],context:''});appState.pre.mapping=priorMapping;assert('linha TOTAL não vira concretagem',!totalVerdict.include,totalVerdict.reason||JSON.stringify(totalVerdict));
    const failed=tests.filter(x=>!x.ok);window.__CG_SELFTEST__={ok:failed.length===0,tests};const banner=document.createElement('div');banner.id='selfTestResult';banner.style.cssText=`position:fixed;left:12px;bottom:12px;z-index:9999;padding:10px 13px;border-radius:10px;color:#fff;background:${failed.length?'#b42318':'#087a55'};font:12px system-ui`;banner.textContent=failed.length?`Self-test: ${failed.length} falha(s)`:`Self-test: ${tests.length} testes OK`;document.body.appendChild(banner);return window.__CG_SELFTEST__}
};
